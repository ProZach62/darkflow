# Scenario 1 - Full homestead loop (live smoke test).
#
# Walks the entire happy path: homestead -> claim charter -> visit plot ->
# build camp marker / lean-to / foundation, confirming the start message,
# the "working on" status, and completion of each tier.
#
# PREREQUISITES (see README):
#   - A FRESH, UNCLAIMED character (claims are permanent, one per name).
#   - At least ~1,400,000 coins (bank + cash):
#       charter 1,000,000 + camp 25,000 + lean-to 75,000 + foundation 250,000.
#   - Starting in a normal room (NOT inside domains/kingdoms/...).
#
# RUNTIME: ~21 minutes (camp 60s + lean-to 300s + foundation 900s, plus slack).
# For routine/CI use run 01b-smoke-camp.yaml instead (~70s).
steps:
  - send: "homestead"
    label: "travel to the kingdom commons"
    expect_contains: ["old road toward the shared kingdom commons"]
    expect_not_contains: ["cannot retreat", "do not answer the dead", "Something here prevents"]

  - send: "look"
    label: "the charter clerk Orrin is present in the commons"
    expect_contains: ["Orrin Quill", "charter desk"]

  - send: "say I accept the charter"
    label: "claim the frontier charter (1,000,000 coins)"
    expect_contains: ["yours by charter, coin, and witness"]
    expect_not_contains: ["You are short", "already hold a frontier plot"]

  - send: "say take me to my plot"
    label: "visit the staked plot"
    expect_contains: ["follow a survey road toward", "Fresh survey stakes"]
    expect_not_contains: ["do not hold a frontier plot"]

  # --- Tier 1: camp marker (60s) ---
  - send: "build camp marker"
    label: "start camp marker build"
    expect_contains: ["begin work on camp marker", "ready in"]
    expect_not_contains: ["Stand on your plot", "Claim a frontier plot", "already have work underway"]

  - send: "homestead status"
    label: "status shows the camp marker job underway"
    expect_contains: ["Working on:", "camp marker finishes in"]

  - wait_ms: 65000
    label: "wait past camp marker completion (60s)"

  - read: true
    label: "drain the completion notice (best-effort)"

  - send: "homestead status"
    label: "camp marker is built, nothing in progress"
    expect_contains: ["Built:", "camp marker"]
    expect_not_contains: ["camp marker finishes in"]

  # --- Tier 2: lean-to (300s) ---
  - send: "build lean-to"
    label: "start lean-to build"
    expect_contains: ["begin work on lean-to", "ready in"]
    expect_not_contains: ["Build the earlier shelter first", "already have work underway"]

  - wait_ms: 305000
    label: "wait past lean-to completion (300s)"

  - read: true

  - send: "homestead status"
    label: "lean-to is built"
    expect_contains: ["Built:", "lean-to"]
    expect_not_contains: ["lean-to finishes in"]

  # --- Tier 3: hut foundation (900s) ---
  - send: "build foundation"
    label: "start hut foundation build"
    expect_contains: ["begin work on hut foundation", "ready in"]
    expect_not_contains: ["Build the earlier shelter first", "already have work underway"]

  - wait_ms: 905000
    label: "wait past foundation completion (900s)"

  - read: true

  - send: "homestead status"
    label: "hut foundation is built"
    expect_contains: ["Built:", "hut foundation"]
    expect_not_contains: ["hut foundation finishes in"]

  - send: "homestead return"
    label: "return along the remembered road"
    expect_contains: ["old road back from the kingdom commons"]
