name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag and signing configuration
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "Desktop production releases require a stable semantic version."; exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "v$VERSION"
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git fetch origin main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$WIN_CSC_LINK"
          test -n "$WIN_CSC_KEY_PASSWORD"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: desktop:release:mac
            artifact: desktop-macos
            platform: mac
          - os: windows-latest
            command: desktop:release:win
            artifact: desktop-windows
            platform: win
          - os: ubuntu-latest
            command: desktop:release:linux
            artifact: desktop-linux
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build desktop packages
        run: npm run ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Validate update artifacts and metadata
        run: npm run desktop:validate-release -- ${{ matrix.platform }} dist/desktop
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 dist/desktop/mac-universal/Darkwind.app
          spctl --assess --verbose=4 --type execute dist/desktop/mac-universal/Darkwind.app
          DMG="$(find dist/desktop -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          xcrun stapler validate "$DMG"
      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/desktop -Filter '*-win-x64.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer signature is $($signature.Status): $($signature.StatusMessage)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.blockmap
            dist/desktop/*.deb
            dist/desktop/*.dmg
            dist/desktop/*.exe
            dist/desktop/latest*.yml
            dist/desktop/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate complete release payload
        run: node desktop/validate-release.cjs all release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Darkwind ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
