<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darkwind MUD Client</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  overflow: hidden;
  background: #0d1117;
  color: #c9d1d9;
  font-family: "Cascadia Code", "Fira Code", "Source Code Pro", "Consolas", monospace;
  font-size: 14px;
}

body {
  display: flex;
  flex-direction: column;
}

#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid #30363d;
  background: #161b22;
  flex-wrap: wrap;
}

#toolbar input[type="text"],
#toolbar input[type="number"] {
  background: #0d1117;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 4px 8px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 13px;
}

#toolbar input#host { width: 160px; }
#toolbar input#port { width: 70px; }

#toolbar label {
  font-size: 12px;
  color: #8b949e;
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

#toolbar button {
  background: #238636;
  color: #fff;
  border: 1px solid #2ea043;
  padding: 4px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}

#toolbar button:hover { background: #2ea043; }
#toolbar button.disconnect { background: #da3633; border-color: #f85149; }
#toolbar button.disconnect:hover { background: #f85149; }
#toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

#connection-state {
  font-size: 12px;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 10px;
}

.state-disconnected { color: #f85149; }
.state-connecting { color: #d29922; }
.state-connected { color: #3fb950; }

#output {
  flex: 1 1 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 12px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: break-word;
  user-select: text;
  -webkit-user-select: text;
  line-height: 1.4;
}

#output::-webkit-scrollbar { width: 8px; }
#output::-webkit-scrollbar-track { background: #0d1117; }
#output::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
#output::-webkit-scrollbar-thumb:hover { background: #484f58; }

.output-line { min-height: 1.4em; }
.echo-line { color: #6e7681; }
.system-line { color: #3fb950; font-style: italic; }

#input-bar {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid #30363d;
  background: #161b22;
}

#command-input {
  flex: 1;
  background: #0d1117;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 6px 10px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

#command-input:focus { border-color: #58a6ff; }

#send-btn {
  background: #238636;
  color: #fff;
  border: 1px solid #2ea043;
  padding: 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}

#send-btn:hover { background: #2ea043; }

#status-bar {
  display: flex;
  gap: 16px;
  padding: 4px 12px;
  font-size: 11px;
  color: #484f58;
  border-top: 1px solid #21262d;
  background: #0d1117;
}

/* ANSI foreground colors */
.ansi-fg-black   { color: #484f58; }
.ansi-fg-red     { color: #ff7b72; }
.ansi-fg-green   { color: #3fb950; }
.ansi-fg-yellow  { color: #d29922; }
.ansi-fg-blue    { color: #58a6ff; }
.ansi-fg-magenta { color: #bc8cff; }
.ansi-fg-cyan    { color: #39d2e0; }
.ansi-fg-white   { color: #c9d1d9; }

.ansi-fg-bright-black   { color: #6e7681; }
.ansi-fg-bright-red     { color: #ffa198; }
.ansi-fg-bright-green   { color: #56d364; }
.ansi-fg-bright-yellow  { color: #e3b341; }
.ansi-fg-bright-blue    { color: #79c0ff; }
.ansi-fg-bright-magenta { color: #d2a8ff; }
.ansi-fg-bright-cyan    { color: #56d4dd; }
.ansi-fg-bright-white   { color: #f0f6fc; }

/* ANSI background colors */
.ansi-bg-black   { background-color: #484f58; }
.ansi-bg-red     { background-color: #ff7b72; }
.ansi-bg-green   { background-color: #3fb950; }
.ansi-bg-yellow  { background-color: #d29922; }
.ansi-bg-blue    { background-color: #58a6ff; }
.ansi-bg-magenta { background-color: #bc8cff; }
.ansi-bg-cyan    { background-color: #39d2e0; }
.ansi-bg-white   { background-color: #c9d1d9; }

.ansi-bg-bright-black   { background-color: #6e7681; }
.ansi-bg-bright-red     { background-color: #ffa198; }
.ansi-bg-bright-green   { background-color: #56d364; }
.ansi-bg-bright-yellow  { background-color: #e3b341; }
.ansi-bg-bright-blue    { background-color: #79c0ff; }
.ansi-bg-bright-magenta { background-color: #d2a8ff; }
.ansi-bg-bright-cyan    { background-color: #56d4dd; }
.ansi-bg-bright-white   { background-color: #f0f6fc; }

.ansi-bold { font-weight: bold; }
.ansi-underline { text-decoration: underline; }

@media (max-width: 600px) {
  #toolbar { gap: 6px; padding: 6px 8px; }
  #toolbar input#host { width: 100px; }
  #toolbar input#port { width: 55px; }
  #status-bar { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>
<body>

<div id="toolbar">
  <input type="text" id="host" placeholder="Host">
  <span style="color:#484f58">:</span>
  <input type="number" id="port" value="4242" min="1" max="65535">
  <label><input type="checkbox" id="wss-toggle"> WSS</label>
  <button id="connect-btn">Connect</button>
  <label><input type="checkbox" id="auto-reconnect"> Auto-reconnect</label>
  <span id="connection-state" class="state-disconnected">Disconnected</span>
</div>

<div id="output"></div>

<div id="input-bar">
  <input type="text" id="command-input" placeholder="Enter command..." autocomplete="off" spellcheck="false">
  <button id="send-btn">Send</button>
</div>

<div id="status-bar">
  <span id="status-url">Not connected</span>
  <span id="status-duration"></span>
  <span id="status-bytes"></span>
</div>

<script>
(function() {
  'use strict';

  // ── Constants ──────────────────────────────────────────────────────────
  const MAX_LINES = 5000;
  const PRUNE_BATCH = 500;
  const MAX_HISTORY = 200;
  const RECONNECT_BASE_MS = 1000;
  const RECONNECT_MAX_MS = 30000;
  const SESSION_KEY = 'darkwind-cmd-history';

  const FG_NAMES = ['black','red','green','yellow','blue','magenta','cyan','white'];
  const BRIGHT_FG_NAMES = ['bright-black','bright-red','bright-green','bright-yellow',
                           'bright-blue','bright-magenta','bright-cyan','bright-white'];

  const DEFAULT_FG = '#c9d1d9';
  const DEFAULT_BG = '#0d1117';

  // 256-color lookup table
  const COLOR_256 = (function() {
    const table = [];
    // 0-7: standard
    const std = ['#484f58','#ff7b72','#3fb950','#d29922','#58a6ff','#bc8cff','#39d2e0','#c9d1d9'];
    // 8-15: bright
    const bright = ['#6e7681','#ffa198','#56d364','#e3b341','#79c0ff','#d2a8ff','#56d4dd','#f0f6fc'];
    for (let i = 0; i < 8; i++) table.push(std[i]);
    for (let i = 0; i < 8; i++) table.push(bright[i]);
    // 16-231: 6x6x6 color cube
    const levels = [0, 95, 135, 175, 215, 255];
    for (let r = 0; r < 6; r++)
      for (let g = 0; g < 6; g++)
        for (let b = 0; b < 6; b++)
          table.push('#' + [levels[r], levels[g], levels[b]].map(v => v.toString(16).padStart(2,'0')).join(''));
    // 232-255: grayscale
    for (let i = 0; i < 24; i++) {
      const v = (8 + i * 10).toString(16).padStart(2, '0');
      table.push('#' + v + v + v);
    }
    return table;
  })();

  // ── DOM refs ───────────────────────────────────────────────────────────
  const hostInput = document.getElementById('host');
  const portInput = document.getElementById('port');
  const wssToggle = document.getElementById('wss-toggle');
  const connectBtn = document.getElementById('connect-btn');
  const autoReconnect = document.getElementById('auto-reconnect');
  const connectionState = document.getElementById('connection-state');
  const outputEl = document.getElementById('output');
  const commandInput = document.getElementById('command-input');
  const sendBtn = document.getElementById('send-btn');
  const statusUrl = document.getElementById('status-url');
  const statusDuration = document.getElementById('status-duration');
  const statusBytes = document.getElementById('status-bytes');

  // ── ANSI Parser ────────────────────────────────────────────────────────
  const ansi = {
    buffer: '',
    bold: false,
    underline: false,
    inverse: false,
    fg: null,  // null=default, {type:'standard',index:0-7}, {type:'bright',index:0-7}, {type:'256',index:0-255}
    bg: null,

    reset() {
      this.bold = false;
      this.underline = false;
      this.inverse = false;
      this.fg = null;
      this.bg = null;
    },

    snapshot() {
      return { bold: this.bold, underline: this.underline, inverse: this.inverse,
               fg: this.fg, bg: this.bg };
    }
  };

  function parseAnsi(text) {
    text = ansi.buffer + text;
    ansi.buffer = '';

    const fragments = []; // {text, style}
    let plain = '';
    let i = 0;

    while (i < text.length) {
      if (text.charCodeAt(i) === 0x1b) {
        // Check for incomplete sequence
        if (i + 1 >= text.length) {
          ansi.buffer = text.slice(i);
          break;
        }
        if (text[i + 1] === '[') {
          // CSI sequence - find the terminating letter
          let j = i + 2;
          while (j < text.length && ((text.charCodeAt(j) >= 0x30 && text.charCodeAt(j) <= 0x3f))) {
            j++;
          }
          // j is now at the first non-parameter character, or end of string
          if (j >= text.length) {
            ansi.buffer = text.slice(i);
            break;
          }
          const finalByte = text.charCodeAt(j);
          if (finalByte < 0x40 || finalByte > 0x7e) {
            // Invalid CSI, skip the ESC
            i++;
            continue;
          }

          // Flush accumulated plain text
          if (plain) {
            fragments.push({ text: plain, style: ansi.snapshot() });
            plain = '';
          }

          if (text[j] === 'm') {
            // SGR sequence
            const paramStr = text.slice(i + 2, j);
            const params = paramStr === '' ? [0] : paramStr.split(';').map(Number);
            let p = 0;
            while (p < params.length) {
              const code = params[p];
              if (code === 0) { ansi.reset(); }
              else if (code === 1) { ansi.bold = true; }
              else if (code === 4) { ansi.underline = true; }
              else if (code === 7) { ansi.inverse = true; }
              else if (code === 22) { ansi.bold = false; }
              else if (code === 24) { ansi.underline = false; }
              else if (code === 27) { ansi.inverse = false; }
              else if (code >= 30 && code <= 37) { ansi.fg = { type: 'standard', index: code - 30 }; }
              else if (code === 38 && params[p+1] === 5 && p + 2 < params.length) {
                ansi.fg = { type: '256', index: params[p+2] };
                p += 2;
              }
              else if (code === 39) { ansi.fg = null; }
              else if (code >= 40 && code <= 47) { ansi.bg = { type: 'standard', index: code - 40 }; }
              else if (code === 48 && params[p+1] === 5 && p + 2 < params.length) {
                ansi.bg = { type: '256', index: params[p+2] };
                p += 2;
              }
              else if (code === 49) { ansi.bg = null; }
              else if (code >= 90 && code <= 97) { ansi.fg = { type: 'bright', index: code - 90 }; }
              else if (code >= 100 && code <= 107) { ansi.bg = { type: 'bright', index: code - 100 }; }
              p++;
            }
          }
          // For non-SGR CSI sequences, just discard them

          i = j + 1;
        } else {
          // Non-CSI escape, skip ESC + next char
          i += 2;
        }
      } else {
        plain += text[i];
        i++;
      }
    }

    if (plain) {
      fragments.push({ text: plain, style: ansi.snapshot() });
    }

    return fragments;
  }

  function resolveColor(color, isBackground) {
    if (!color) return isBackground ? DEFAULT_BG : DEFAULT_FG;
    if (color.type === '256') return COLOR_256[color.index] || (isBackground ? DEFAULT_BG : DEFAULT_FG);
    if (color.type === 'standard') return COLOR_256[color.index];
    if (color.type === 'bright') return COLOR_256[color.index + 8];
    return isBackground ? DEFAULT_BG : DEFAULT_FG;
  }

  function styleToElement(text, style) {
    if (!text) return null;

    const needsStyling = style.bold || style.underline || style.inverse || style.fg || style.bg;
    if (!needsStyling) {
      return document.createTextNode(text);
    }

    const span = document.createElement('span');
    const classes = [];
    let inlineFg = null;
    let inlineBg = null;

    if (style.inverse) {
      // Swap fg and bg, use inline styles
      inlineFg = resolveColor(style.bg, true);
      inlineBg = resolveColor(style.fg, false);
    } else {
      if (style.fg) {
        if (style.fg.type === '256') {
          inlineFg = COLOR_256[style.fg.index];
        } else if (style.fg.type === 'standard') {
          classes.push('ansi-fg-' + FG_NAMES[style.fg.index]);
        } else if (style.fg.type === 'bright') {
          classes.push('ansi-fg-' + BRIGHT_FG_NAMES[style.fg.index]);
        }
      }
      if (style.bg) {
        if (style.bg.type === '256') {
          inlineBg = COLOR_256[style.bg.index];
        } else if (style.bg.type === 'standard') {
          classes.push('ansi-bg-' + FG_NAMES[style.bg.index]);
        } else if (style.bg.type === 'bright') {
          classes.push('ansi-bg-' + BRIGHT_FG_NAMES[style.bg.index]);
        }
      }
    }

    if (style.bold) classes.push('ansi-bold');
    if (style.underline) classes.push('ansi-underline');

    if (classes.length) span.className = classes.join(' ');
    let inlineStyle = '';
    if (inlineFg) inlineStyle += 'color:' + inlineFg + ';';
    if (inlineBg) inlineStyle += 'background-color:' + inlineBg + ';';
    if (inlineStyle) span.setAttribute('style', inlineStyle);

    span.appendChild(document.createTextNode(text));
    return span;
  }

  // ── Output Display ─────────────────────────────────────────────────────
  let isScrollLocked = false;
  let lineCount = 0;
  let pendingDivs = [];
  let rafScheduled = false;

  outputEl.addEventListener('scroll', function() {
    const atBottom = (outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight) < 5;
    isScrollLocked = !atBottom;
  });

  function appendOutput(text, cssClass) {
    const fragments = parseAnsi(text);

    // Split fragments into lines by \n
    const lines = [[]];
    for (const frag of fragments) {
      const parts = frag.text.split('\n');
      for (let i = 0; i < parts.length; i++) {
        if (i > 0) lines.push([]);
        if (parts[i]) {
          lines[lines.length - 1].push({ text: parts[i], style: frag.style });
        }
      }
    }

    for (const lineFrags of lines) {
      const div = document.createElement('div');
      div.className = 'output-line' + (cssClass ? ' ' + cssClass : '');
      if (lineFrags.length === 0) {
        div.appendChild(document.createTextNode('\u200B')); // zero-width space for empty lines
      } else {
        for (const frag of lineFrags) {
          const el = styleToElement(frag.text, frag.style);
          if (el) div.appendChild(el);
        }
      }
      pendingDivs.push(div);
    }

    if (!rafScheduled) {
      rafScheduled = true;
      requestAnimationFrame(flushOutput);
    }
  }

  function appendSystemMessage(text) {
    // System messages bypass ANSI parsing
    const div = document.createElement('div');
    div.className = 'output-line system-line';
    div.appendChild(document.createTextNode(text));
    pendingDivs.push(div);
    if (!rafScheduled) {
      rafScheduled = true;
      requestAnimationFrame(flushOutput);
    }
  }

  function appendEcho(text) {
    const div = document.createElement('div');
    div.className = 'output-line echo-line';
    div.appendChild(document.createTextNode('> ' + text));
    pendingDivs.push(div);
    if (!rafScheduled) {
      rafScheduled = true;
      requestAnimationFrame(flushOutput);
    }
  }

  function flushOutput() {
    rafScheduled = false;
    if (pendingDivs.length === 0) return;

    const frag = document.createDocumentFragment();
    for (const div of pendingDivs) frag.appendChild(div);
    lineCount += pendingDivs.length;
    pendingDivs = [];

    outputEl.appendChild(frag);

    // Prune old lines
    if (lineCount > MAX_LINES) {
      const toRemove = Math.min(PRUNE_BATCH, lineCount - MAX_LINES);
      for (let i = 0; i < toRemove; i++) {
        outputEl.removeChild(outputEl.firstChild);
      }
      lineCount -= toRemove;
    }

    if (!isScrollLocked) {
      outputEl.scrollTop = outputEl.scrollHeight;
    }
  }

  function clearOutput() {
    outputEl.textContent = '';
    lineCount = 0;
    pendingDivs = [];
  }

  // ── Connection Manager ─────────────────────────────────────────────────
  let ws = null;
  let connectTime = null;
  let bytesSent = 0;
  let bytesReceived = 0;
  let reconnectAttempts = 0;
  let reconnectTimer = null;
  let userDisconnected = false;

  function setConnectionState(state) {
    connectionState.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    connectionState.className = 'state-' + state;

    if (state === 'connecting') {
      connectBtn.textContent = 'Connecting...';
      connectBtn.disabled = true;
      connectBtn.classList.remove('disconnect');
    } else if (state === 'connected') {
      connectBtn.textContent = 'Disconnect';
      connectBtn.disabled = false;
      connectBtn.classList.add('disconnect');
      commandInput.disabled = false;
      sendBtn.disabled = false;
    } else {
      connectBtn.textContent = 'Connect';
      connectBtn.disabled = false;
      connectBtn.classList.remove('disconnect');
      commandInput.disabled = false;
      sendBtn.disabled = false;
    }
  }

  function connect() {
    if (ws) return;

    userDisconnected = false;
    const protocol = wssToggle.checked ? 'wss' : 'ws';
    const host = hostInput.value || 'localhost';
    const port = portInput.value || '4242';
    const url = protocol + '://' + host + ':' + port + '/';

    setConnectionState('connecting');
    appendSystemMessage('Connecting to ' + url + '...');

    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function() {
      setConnectionState('connected');
      connectTime = Date.now();
      bytesSent = 0;
      bytesReceived = 0;
      reconnectAttempts = 0;
      appendSystemMessage('Connected to ' + url);
      statusUrl.textContent = url;
      commandInput.focus();
    };

    ws.onmessage = function(event) {
      if (typeof event.data === 'string') {
        bytesReceived += event.data.length;
        appendOutput(event.data);
      } else {
        // Binary frame (ArrayBuffer)
        const arr = new Uint8Array(event.data);
        bytesReceived += arr.length;
        const hex = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(' ');
        appendSystemMessage('[Binary: ' + hex + ']');
      }
    };

    ws.onerror = function() {
      appendSystemMessage('WebSocket error');
    };

    ws.onclose = function(event) {
      ws = null;
      connectTime = null;
      setConnectionState('disconnected');

      let msg;
      if (event.code === 1000) msg = 'Disconnected';
      else if (event.code === 1001) msg = 'Server closed connection';
      else if (event.code === 1006) msg = 'Connection lost';
      else msg = 'Closed (code ' + event.code + (event.reason ? ': ' + event.reason : '') + ')';

      appendSystemMessage(msg);
      statusUrl.textContent = 'Not connected';
      statusDuration.textContent = '';

      if (!userDisconnected && autoReconnect.checked) {
        scheduleReconnect();
      }
    };
  }

  function disconnect() {
    userDisconnected = true;
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    if (ws) {
      ws.close(1000, 'User disconnect');
    }
  }

  function scheduleReconnect() {
    reconnectAttempts++;
    const delay = Math.min(RECONNECT_BASE_MS * Math.pow(2, reconnectAttempts - 1), RECONNECT_MAX_MS);
    appendSystemMessage('Reconnecting in ' + (delay / 1000).toFixed(0) + 's...');
    reconnectTimer = setTimeout(function() {
      reconnectTimer = null;
      connect();
    }, delay);
  }

  connectBtn.addEventListener('click', function() {
    if (ws || connectBtn.classList.contains('disconnect')) {
      disconnect();
    } else {
      connect();
    }
  });

  // ── Command Input & History ────────────────────────────────────────────
  let commandHistory = [];
  let historyIndex = 0;
  let currentInput = '';

  function loadHistory() {
    try {
      const stored = sessionStorage.getItem(SESSION_KEY);
      if (stored) commandHistory = JSON.parse(stored);
    } catch(e) { /* ignore */ }
    historyIndex = commandHistory.length;
  }

  function saveHistory() {
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(commandHistory));
    } catch(e) { /* ignore */ }
  }

  function sendCommand() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const text = commandInput.value;
    ws.send(text);
    bytesSent += text.length;

    if (text) {
      commandHistory.push(text);
      if (commandHistory.length > MAX_HISTORY) {
        commandHistory.splice(0, commandHistory.length - MAX_HISTORY);
      }
      saveHistory();
    }

    appendEcho(text);
    commandInput.value = '';
    historyIndex = commandHistory.length;
    currentInput = '';
    commandInput.focus();
  }

  commandInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendCommand();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (commandHistory.length === 0) return;
      if (historyIndex === commandHistory.length) {
        currentInput = commandInput.value;
      }
      if (historyIndex > 0) {
        historyIndex--;
        commandInput.value = commandHistory[historyIndex];
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex < commandHistory.length) {
        historyIndex++;
        if (historyIndex === commandHistory.length) {
          commandInput.value = currentInput;
        } else {
          commandInput.value = commandHistory[historyIndex];
        }
      }
    }
  });

  sendBtn.addEventListener('click', sendCommand);

  // ── Keyboard Shortcuts ─────────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'l') {
      e.preventDefault();
      clearOutput();
    } else if (e.key === 'Escape') {
      commandInput.value = '';
      commandInput.focus();
    } else if (e.key === 'PageUp') {
      e.preventDefault();
      outputEl.scrollBy(0, -outputEl.clientHeight * 0.8);
    } else if (e.key === 'PageDown') {
      e.preventDefault();
      outputEl.scrollBy(0, outputEl.clientHeight * 0.8);
    }
  });

  // ── Status Bar ─────────────────────────────────────────────────────────
  function formatDuration(ms) {
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
    if (m > 0) return m + 'm ' + s + 's';
    return s + 's';
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  setInterval(function() {
    if (connectTime) {
      statusDuration.textContent = formatDuration(Date.now() - connectTime);
    }
    statusBytes.textContent = 'Sent: ' + formatBytes(bytesSent) + ' / Recv: ' + formatBytes(bytesReceived);
  }, 1000);

  // ── Init ───────────────────────────────────────────────────────────────
  hostInput.value = 'darkwind.ai';
  wssToggle.checked = true;
  loadHistory();
  commandInput.focus();

  window.addEventListener('beforeunload', function() {
    saveHistory();
    if (ws) ws.close(1000, 'Page unload');
  });

})();
</script>
</body>
</html>
