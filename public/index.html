<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darkwind MUD Client</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>

<div id="toolbar">
  <input type="text" id="host" placeholder="Host">
  <span style="color:#484f58">:</span>
  <input type="number" id="port" value="4242" min="1" max="65535">
  <label><input type="checkbox" id="wss-toggle"> WSS</label>
  <button id="connect-btn">Connect</button>
  <label><input type="checkbox" id="auto-reconnect"> Auto-reconnect</label>
  <span id="connection-state" class="state-disconnected">Disconnected</span>
  <button id="left-dock-toggle" class="dock-toggle-btn active" style="margin-left:auto" title="Toggle left sidebar">&#x25E7;</button>
  <button id="right-dock-toggle" class="dock-toggle-btn active" title="Toggle right sidebar">&#x25E8;</button>
  <span class="panels-menu-wrap">
    <button id="panels-menu-btn" class="dock-toggle-btn" title="Panels">Panels &#x25BE;</button>
    <div id="panels-menu" class="panels-menu"></div>
  </span>
  <button id="gmcp-toggle" style="background:#21262d;border-color:#30363d;color:#8b949e;font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer">GMCP</button>
</div>

<div id="main-content">
  <div id="left-dock" class="dock-column"></div>
  <div id="center-column">
    <div id="output"></div>
    <div id="gmcp-panel"></div>
  </div>
  <div id="right-dock" class="dock-column"></div>
</div>

<div id="input-bar">
  <input type="text" id="command-input" placeholder="Enter command..." autocomplete="off" spellcheck="false">
  <button id="send-btn">Send</button>
</div>

<div id="status-bar">
  <span id="status-url">Not connected</span>
  <span id="status-duration"></span>
  <span id="status-bytes"></span>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
