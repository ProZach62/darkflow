<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUD Client</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/windows.css">
<link rel="stylesheet" href="css/ide.css">
</head>
<body>

<div id="toolbar">
  <div class="toolbar-left">
    <span class="toolbar-brand" id="toolbar-brand">MUD Client</span>
    <span id="toolbar-connect-fields">
      <input type="text" id="host" placeholder="Host">
      <span style="color:#484f58">:</span>
      <input type="number" id="port" value="4242" min="1" max="65535">
      <label class="toolbar-label"><input type="checkbox" id="wss-toggle"> WSS</label>
      <button id="connect-btn">Connect</button>
    </span>
    <span id="toolbar-status" class="toolbar-status" style="display:none">
      <span id="connection-dot" class="conn-dot dot-disconnected"></span>
      <span id="connection-state">Disconnected</span>
    </span>
  </div>
  <div class="toolbar-right">
    <button id="notifications-btn" class="toolbar-icon-btn disabled" title="Events (coming soon)">&#x1F514;</button>
    <button id="mail-btn" class="toolbar-icon-btn" title="Announcements">&#x1F4F0;</button>
    <span class="toolbar-separator"></span>
    <button id="left-dock-toggle" class="toolbar-icon-btn active" title="Left sidebar">&#x25E7;</button>
    <button id="right-dock-toggle" class="toolbar-icon-btn active" title="Right sidebar">&#x25E8;</button>
    <button id="mobile-panels-btn" class="toolbar-icon-btn" title="Panels">&#x2630;</button>
    <span class="panels-menu-wrap">
      <button id="panels-menu-btn" class="toolbar-icon-btn" title="Panels">&#x2630;</button>
      <div id="panels-menu" class="panels-menu"></div>
    </span>
    <span class="toolbar-separator"></span>
    <button id="gmcp-toggle" class="toolbar-icon-btn" title="GMCP Debug">&#x2756;</button>
    <span class="gear-menu-wrap">
      <button id="gear-btn" class="toolbar-icon-btn" title="Settings">&#x2699;</button>
    </span>
  </div>
</div>

<div id="main-content">
  <div id="left-dock" class="dock-column"></div>
  <div id="center-column">
    <div id="output-shell">
      <button id="output-live-btn" type="button" title="Return to live terminal">Live</button>
      <button id="output-pause-btn" type="button" aria-pressed="false" title="Resume live terminal">Paused</button>
      <div id="output" class="output-pane"></div>
      <div id="output-split">
        <div id="output-history" class="output-pane"></div>
        <div id="output-divider" role="separator" aria-orientation="horizontal" aria-label="Resize terminal split"></div>
        <div id="output-live" class="output-pane"></div>
      </div>
    </div>
    <div id="gmcp-panel"></div>
  </div>
  <div id="right-dock" class="dock-column"></div>
</div>

<div id="input-bar">
  <input type="text" id="command-input" placeholder="Enter command..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="send-btn">Send</button>
</div>

<div id="status-bar">
  <span id="status-connection">Not connected</span>
  <span id="status-uptime"></span>
  <span id="status-versions"></span>
</div>

<div id="update-banner">
  A new client version is available. <a href="#" id="update-refresh">Refresh to update</a>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
